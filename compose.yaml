services:
  data-platform-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starcat_data_platform
      POSTGRES_USER: starcat
      POSTGRES_PASSWORD: starcat
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - starcat-data-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starcat -d starcat_data_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  starcat-data-platform-postgres:
